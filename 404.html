<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ghulam Mustafa — Portfolio</title>
    <!-- GitHub Pages SPA redirect trick (https://github.com/rafgraph/spa-github-pages)
         Encodes the requested deep-link path into a query string and redirects to the
         real index.html, which restores it via the script there. This lets direct links
         and refreshes on routes like /about or /portfolio work on GitHub Pages. -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
